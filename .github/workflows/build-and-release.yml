name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg binutils libfuse2 ffmpeg

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Linux packages
        run: |
          ./gradlew :desktop:packageAppImage :desktop:packageDeb --no-daemon

      - name: Upload Linux assets to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop/build/compose/binaries/main/appimage/*.AppImage
            desktop/build/compose/binaries/main/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
